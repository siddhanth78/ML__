version: '3'
services:
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  ollama-pull:
    image: curlimages/curl
    command: ["-X", "POST", "http://ollama:11434/api/pull", "-d", '{"name": "llama2"}']
    depends_on:
      - ollama

  app:
    build: .
    volumes:
      - .:/app
    environment:
      - PDF_PATH=/app/index.pdf
      - OLLAMA_URL=http://ollama:11434
    depends_on:
      - ollama
    stdin_open: true
    tty: true

volumes:
  ollama_data: